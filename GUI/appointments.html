<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Hẹn - Hệ Thống Quản Lý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="appointments-page">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Lịch hẹn của bạn</h1>

            <!-- Lịch hẹn sắp tới -->
            <div class="mb-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Sắp tới</h2>
                <div class="space-y-4">
                    <!-- Ví dụ 1 -->
                    <div class="bg-white p-4 rounded-lg shadow-md flex justify-between items-center">
                        <div>
                            <p class="font-bold text-blue-600">Khám Tim mạch</p>
                            <p class="text-sm text-gray-600">BS. Nguyễn Văn A</p>
                            <p class="text-sm text-gray-500">09:00 - Thứ Ba, 25/12/2024</p>
                        </div>
                        <span class="px-3 py-1 text-xs font-semibold text-green-800 bg-green-100 rounded-full">Đã xác nhận</span>
                    </div>
                </div>
            </div>

            <!-- Lịch hẹn đã qua -->
            <div>
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Đã qua</h2>
                <div class="space-y-4">
                    <!-- Ví dụ 2 -->
                    <div class="bg-white p-4 rounded-lg shadow-sm flex justify-between items-center opacity-70">
                        <div>
                            <p class="font-bold text-gray-700">Khám tổng quát</p>
                            <p class="text-sm text-gray-600">BS. Trần Thị B</p>
                            <p class="text-sm text-gray-500">14:30 - Thứ Sáu, 15/11/2024</p>
                        </div>
                        <span class="px-3 py-1 text-xs font-semibold text-gray-800 bg-gray-200 rounded-full">Đã hoàn thành</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    </div>

    <!-- SỬA LẠI ĐƯỜNG DẪN TẠI ĐÂY -->
    <script src="../Js/main.js"></script>
</body>
</html>
