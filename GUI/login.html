<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Quản Lý</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .hidden-message {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- =================================================================
         TRANG ĐĂNG NHẬP (LOGIN PAGE)
         ================================================================== -->
    <div id="login-page" class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
            <div class="text-center">
                <!-- Icon y tế -->
                <div class="flex justify-center mx-auto mb-4">
                     <svg class="w-12 h-12 text-blue-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"></path><path d="M12 12 8 8"></path><path d="m12 12 4 4"></path><path d="m12 12 4-4"></path><path d="m12 12-4 4"></path></svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">Đăng Nhập Hệ Thống</h1>
                <p class="mt-2 text-sm text-gray-600">Quản lý Khám Chữa Bệnh</p>
            </div>

            <!-- Form đăng nhập -->
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="username" class="text-sm font-medium text-gray-700">Tên đăng nhập</label>
                    <input id="username" name="username" type="text" required
                           class="w-full px-4 py-2 mt-2 text-base text-gray-700 placeholder-gray-500 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="password" class="text-sm font-medium text-gray-700">Mật khẩu</label>
                    <input id="password" name="password" type="password" required
                           class="w-full px-4 py-2 mt-2 text-base text-gray-700 placeholder-gray-500 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <!-- Thông báo lỗi -->
                <div id="error-message" class="text-sm text-red-600 hidden-message text-center">Tên đăng nhập hoặc mật khẩu không chính xác.</div>

                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                        Đăng nhập
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Hàm để ghi lại hoạt động
        function logActivity(user, action) {
            const history = JSON.parse(localStorage.getItem('activityHistory')) || [];
            const newLog = {
                user: user,
                action: action,
                timestamp: new Date().toLocaleString('vi-VN')
            };
            history.unshift(newLog); // Thêm vào đầu mảng
            localStorage.setItem('activityHistory', JSON.stringify(history.slice(0, 50))); // Giới hạn 50 mục
        }

        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Ngăn form tải lại trang

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // --- GIẢ LẬP CSDL NGƯỜI DÙNG VỚI VAI TRÒ ---
            const users = {
                admin: { password: '123456', role: 'admin' },
                khach: { password: '123', role: 'guest' }
            };

            const user = users[username];

            // --- KIỂM TRA ĐĂNG NHẬP ---
            if (user && user.password === password) {
                // Lưu trạng thái đăng nhập (ví dụ: tên người dùng)
                // sessionStorage chỉ lưu dữ liệu trong phiên làm việc của tab
                sessionStorage.setItem('loggedInUser', username);
                sessionStorage.setItem('userRole', user.role);

                // Ghi lại hoạt động đăng nhập
                logActivity(username, 'Đăng nhập thành công');

                // Chuyển hướng đến trang chủ
                window.location.href = 'home.html';
            } else {
                // Hiển thị thông báo lỗi
                errorMessage.classList.remove('hidden-message');
            }
        });
    </script>
</body>
</html>
