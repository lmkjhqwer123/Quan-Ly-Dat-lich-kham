<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bác Sĩ - UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Màu nền xám nhẹ */
        }
        /* Style cho các nút hành động trong bảng */
        .action-link {
            font-size: 0.875rem; /* 14px */
            font-weight: 500;
            text-decoration: underline;
        }
        .action-link-edit {
            color: #3B82F6; /* Màu xanh */
        }
        .action-link-delete {
            color: #EF4444; /* Màu đỏ */
        }
        .action-link-detail {
            color: #10B981; /* Màu xanh lá */
        }
    </style>
</head>
<body class="bg-gray-100">



    <!-- Nội dung chính -->
    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Quản lý bác sĩ</h1>

            <!-- Bộ lọc tìm kiếm -->
            <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
                
                <!-- Hàng 1: Tìm kiếm & Nút -->
                <div class="flex flex-wrap items-center gap-4 mb-4">
                    <div class="relative flex-grow" style="min-width: 300px;">
                        <input type="text" placeholder="Bạn đang cần tìm gì?" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <button class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 transition-colors">
                        Tìm kiếm
                    </button>
                    <button class="px-6 py-2 bg-red-500 text-white font-semibold rounded-md hover:bg-red-600 transition-colors">
                        Làm mới
                    </button>
                    <button class="px-6 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-600 transition-colors">
                        Tạo mới
                    </button>
                </div>

                <!-- Hàng 2: Các bộ lọc Dropdown -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="sort-direction" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo chiều</label>
                        <select id="sort-direction" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="asc">Từ trên xuống dưới</option>
                            <option value="desc">Từ dưới lên trên</option>
                        </select>
                    </div>
                    <div>
                        <label for="sort-value" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo giá trị</label>
                        <select id="sort-value" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="name">Họ tên</option>
                            <option value="role">Vai trò</option>
                        </select>
                    </div>
                    <div>
                        <label for="sort-status" class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
                        <select id="sort-status" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="active">Đang hoạt động</option>
                            <option value="inactive">Không hoạt động</option>
                        </select>
                    </div>
                    <div>
                        <label for="sort-speciality" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo chuyên khoa</label>
                        <select id="sort-speciality" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="noi-tong-hop">Nội tổng hợp</option>
                            <option value="ho-tro-vien">Hỗ trợ viên</option>
                        </select>
                    </div>
                    <div>
                        <label for="sort-room" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo phòng khám</label>
                        <select id="sort-room" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="phong-101">Phòng 101</option>
                            <option value="phong-102">Phòng 102</option>
                        </select>
                    </div>
                     <div>
                        <label for="result-count" class="block text-sm font-medium text-gray-700 mb-1">Số lượng kết quả trả về</label>
                        <select id="result-count" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Bảng danh sách bác sĩ -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <h2 class="text-lg font-semibold text-gray-800 p-6 border-b border-gray-200">
                    Danh sách khám bệnh
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50">
                            <tr class="text-sm text-gray-600 uppercase">
                                <th class="py-3 px-6 font-medium"></th>
                                <th class="py-3 px-6 font-medium">Chuyên khoa</th>
                                <th class="py-3 px-6 font-medium">Họ tên</th>
                                <th class="py-3 px-6 font-medium">Số điện thoại</th>
                                <th class="py-3 px-6 font-medium">Vai trò</th>
                                <th class="py-3 px-6 font-medium">Trạng thái</th>
                                <th class="py-3 px-6 font-medium text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700">
                            <!-- Dữ liệu mẫu 1 -->
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-4 px-6">
                                    <img class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/40x40/EBF8FF/3182CE?text=NT" alt="Avatar">
                                </td>
                                <td class="py-4 px-6 font-medium">Nội tổng hợp</td>
                                <td class="py-4 px-6 font-medium">Nguyễn Thị Thu Trang</td>
                                <td class="py-4 px-6">0123456789</td>
                                <td class="py-4 px-6">Trưởng khoa</td>
                                <td class="py-4 px-6">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                                    </svg>
                                </td>
                                <td class="py-4 px-6 text-center space-x-3">
                                    <a href="#" class="action-link action-link-edit">Sửa</a>
                                    <a href="#" class="action-link action-link-delete">Xóa</a>
                                    <a href="#" class="action-link action-link-detail">Chi tiết</a>
                                </td>
                            </tr>
                            
                            <!-- Dữ liệu mẫu 2 -->
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-4 px-6">
                                    <img class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/40x40/FEF2F2/EF4444?text=PH" alt="Avatar">
                                </td>
                                <td class="py-4 px-6 font-medium">Hỗ trợ viên</td>
                                <td class="py-4 px-6 font-medium">Phạm Xuân Hậu</td>
                                <td class="py-4 px-6">0978246246</td>
                                <td class="py-4 px-6">Hỗ trợ viên</td>
                                <td class="py-4 px-6">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                                    </svg>
                                </td>
                                <td class="py-4 px-6 text-center space-x-3">
                                    <a href="#" class="action-link action-link-edit">Sửa</a>
                                    <a href="#" class="action-link action-link-delete">Xóa</a>
                                    <a href="#" class="action-link action-link-detail">Chi tiết</a>
                                </td>
                            </tr>
                            
                            <!-- Dữ liệu mẫu 3 -->
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-4 px-6">
                                    <img class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/40x40/ECFDF5/10B981?text=M" alt="Avatar">
                                </td>
                                <td class="py-4 px-6 font-medium">Nội tổng hợp</td>
                                <td class="py-4 px-6 font-medium">Maus</td>
                                <td class="py-4 px-6">0766335563</td>
                                <td class="py-4 px-6">Bác sĩ</td>
                                <td class="py-4 px-6">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                                    </svg>
                                </td>
                                <td class="py-4 px-6 text-center space-x-3">
                                    <a href="#" class="action-link action-link-edit">Sửa</a>
                                    <a href="#" class="action-link action-link-delete">Xóa</a>
                                    <a href="#" class="action-link action-link-detail">Chi tiết</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
