<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bệnh Án - UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Màu nền xám nhẹ */
        }
        /* Style cho các nút hành động trong bảng */
        .btn-action {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.875rem; /* 14px */
            font-weight: 500;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }
        .btn-record {
            border-color: #3B82F6; /* Màu xanh dương */
            color: #3B82F6;
        }
        .btn-record:hover {
            background-color: #EFF6FF;
        }
        /* Style cho tiêu đề phần trong modal */
        .section-header {
            background-color: #eff6ff; /* bg-blue-50 */
            padding: 0.75rem 1rem;
            border-left: 4px solid #3b82f6; /* border-blue-500 */
            font-weight: 600;
            color: #1e40af; /* text-blue-800 */
            margin-bottom: 1rem;
            border-top-right-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .readonly-field {
            background-color: #f9fafb; /* bg-gray-50 */
            border-color: #e5e7eb; /* border-gray-200 */
            color: #4b5563; /* text-gray-600 */
            cursor: not-allowed;
        }
        /* Style cho label trong modal */
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151; /* text-gray-700 */
            margin-bottom: 0.25rem;
        }
        /* Style cho input/select/textarea trong modal */
        .form-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db; /* border-gray-300 */
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Quản lý Bệnh án</h1>

        <!-- Bộ lọc và tìm kiếm -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Bộ lọc và tìm kiếm</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Search Input -->
                <div class="lg:col-span-2">
                    <label for="search-input" class="block text-sm font-medium text-gray-700 mb-1">Tìm kiếm</label>
                    <input type="text" id="search-input" placeholder="Tìm theo tên, mã, bác sĩ..." class="w-full pl-4 pr-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <!-- Result Count -->
                <div>
                    <label for="result-count" class="block text-sm font-medium text-gray-700 mb-1">Số kết quả</label>
                    <select id="result-count" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Mặc định</option>
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <!-- Sort Value -->
                <div>
                    <label for="sort-value" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo</label>
                    <select id="sort-value" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Mặc định</option>
                        <option value="patient_name">Tên bệnh nhân</option>
                        <option value="doctor_name">Tên bác sĩ</option>
                        <option value="examination_date">Ngày khám</option>
                    </select>
                </div>
                <!-- Sort Direction -->
                <div>
                    <label for="sort-direction" class="block text-sm font-medium text-gray-700 mb-1">Thứ tự</label>
                    <select id="sort-direction" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="desc">Giảm dần</option>
                        <option value="asc">Tăng dần</option>
                    </select>
                </div>
                <!-- Specialty Filter -->
                <div>
                    <label for="sort-speciality" class="block text-sm font-medium text-gray-700 mb-1">Chuyên khoa</label>
                    <select id="sort-speciality" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Tất cả</option>
                        <!-- Options will be populated dynamically or manually -->
                    </select>
                </div>
                <!-- Action Buttons -->
                <div class="lg:col-start-4 flex items-end space-x-2">
                    <button id="search-button" class="w-full px-6 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors">
                        Tìm kiếm
                    </button>
                    <button id="refresh-button" class="w-full px-6 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-600 transition-colors">
                        Làm mới
                    </button>
                </div>
            </div>
        </div>

        <!-- Bảng danh sách bệnh án -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <h2 class="text-lg font-semibold text-gray-800 p-6 border-b border-gray-200">
                Danh sách bệnh án
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                        <tr class="text-sm text-gray-600 uppercase">
                            <th class="py-3 px-6 font-medium">Mã lượt khám</th>
                            <th class="py-3 px-6 font-medium">Bệnh nhân</th>
                            <th class="py-3 px-6 font-medium">Bác sĩ phụ trách</th>
                            <th class="py-3 px-6 font-medium">Chuyên khoa</th>
                            <th class="py-3 px-6 font-medium">Ngày khám</th>
                            <th class="py-3 px-6 font-medium">Chẩn đoán</th>
                            <th class="py-3 px-6 font-medium text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="medical-record-table-body" class="text-gray-700">
                        <!-- Dữ liệu sẽ được tải bởi JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <!-- Phân trang -->
            <div class="p-4 flex justify-end items-center space-x-2 border-t border-gray-200">
                <button class="px-3 py-1 text-sm text-gray-600 bg-gray-100 rounded-md hover:bg-gray-200">Previous</button>
                <button class="px-3 py-1 text-sm text-white bg-blue-600 rounded-md">1</button>
                <button class="px-3 py-1 text-sm text-gray-600 bg-gray-100 rounded-md hover:bg-gray-200">Next</button>
            </div>
        </div>
    </div>
    <script src="/Js/benh_an.js"></script>

    <!-- Medical Record Detail Modal -->
    <div id="medical-record-detail-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-800 bg-opacity-50 p-4">
        <div class="w-full max-w-4xl rounded-xl bg-white shadow-xl overflow-hidden">
            <!-- Header Bệnh án -->
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white relative">
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-2xl font-bold">BỆNH ÁN ĐIỆN TỬ</h1>
                    </div>
                    <p class="text-sm opacity-90">Mã hồ sơ: <span id="detail-medical-record-id" class="font-mono font-bold"></span> | Mã lượt khám: <span id="detail-booking-code" class="font-mono font-bold"></span></p>
                </div>
                <div class="text-right">
                    <p id="detail-doctor-name" class="font-semibold text-lg"></p>
                    <p id="detail-specialty-name" class="text-sm opacity-90"></p>
                </div>
                <button id="close-medical-record-detail-modal" class="absolute top-2 right-2 text-gray-300 hover:text-white text-3xl font-light">&times;</button>
            </div>

            <div class="p-6 space-y-8 max-h-[80vh] overflow-y-auto">
                <!-- I. HÀNH CHÍNH -->
                <section>
                    <h2 class="section-header">
                        I. THÔNG TIN HÀNH CHÍNH
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="form-label">Họ và tên bệnh nhân</label>
                            <input id="detail-patient-name" type="text" class="form-input readonly-field" readonly>
                        </div>
                        <div>
                            <label class="form-label">Ngày khám</label>
                            <input id="detail-examination-date" type="text" class="form-input readonly-field" readonly>
                        </div>
                        <div>
                            <label class="form-label">Giờ khám</label>
                            <input id="detail-examination-time" type="text" class="form-input readonly-field" readonly>
                        </div>
                    </div>
                </section>

                <!-- II. CHẨN ĐOÁN -->
                <section>
                    <h2 class="section-header">II. CHẨN ĐOÁN & KẾT LUẬN</h2>
                    <div>
                        <label class="form-label text-red-600 font-bold">Chẩn đoán</p>
                        <textarea id="detail-diagnosis-out" class="form-input readonly-field" rows="3" readonly></textarea>
                    </div>
                </section>

                <!-- Footer Action Buttons -->
                <div class="border-t pt-6 flex justify-end items-center gap-4">
                    <button type="button" class="px-6 py-2 bg-white border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition-colors w-full md:w-auto">
                        <span class="flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                            In Bệnh án
                        </span>
                    </button>
                    <button id="close-medical-record-detail-btn" class="rounded-md bg-gray-300 px-6 py-2 text-gray-800 hover:bg-gray-400 font-semibold">
                        Đóng
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
