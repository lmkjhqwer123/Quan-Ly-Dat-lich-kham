<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dịch Vụ - UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Màu nền xám nhẹ */
        }
        /* Đảm bảo tất cả input fields dùng Inter font */
        input, select, textarea, label {
            font-family: 'Inter', sans-serif !important;
        }
        /* Style cho các nút hành động trong bảng */
        .btn-action {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.875rem; /* 14px */
            font-weight: 500;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }
        .btn-edit {
            border-color: #34D399; /* Màu xanh lá */
            color: #34D399;
        }
        .btn-edit:hover {
            background-color: #F0FDF4;
        }
        .btn-doctors {
            border-color: #3B82F6; /* Màu xanh dương */
            color: #3B82F6;
        }
        .btn-doctors:hover {
            background-color: #EFF6FF;
        }
        .btn-delete {
            border-color: #EF4444; /* Màu đỏ */
            color: #EF4444;
        }
        .btn-delete:hover {
            background-color: #FEF2F2;
        }
    </style>
</head>
<body class="bg-gray-100">



    <!-- Nội dung chính -->
    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Quản lý dịch vụ</h1>

            <!-- Bộ lọc tìm kiếm -->
            <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
                
                <!-- Hàng 1: Tìm kiếm & Nút -->
                <div class="flex flex-wrap items-center gap-4 mb-4">
                    <div class="relative flex-grow" style="min-width: 300px;">
                        <input type="text" id="search-input" placeholder="Bạn đang cần tìm gì?" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <button id="search-button" class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 transition-colors">
                        Tìm kiếm
                    </button>
                    <button id="refresh-button" class="px-6 py-2 bg-red-500 text-white font-semibold rounded-md hover:bg-red-600 transition-colors">
                        Làm mới
                    </button>
                    <button id="create-new-button" class="px-6 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-600 transition-colors">
                        Tạo mới
                    </button>
                </div>

                <!-- Hàng 2: Các bộ lọc Dropdown -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="sort-direction" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo chiều</label>
                        <select id="sort-direction" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="asc">Từ trên xuống dưới</option>
                            <option value="desc">Từ dưới lên trên</option>
                        </select>
                    </div>
                    <div>
                        <label for="sort-value" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo giá trị</label>
                        <select id="sort-value" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="id">ID</option>
                            <option value="name">Tên</option>
                        </select>
                    </div>
                    <!-- <div>
                        <label for="result-count" class="block text-sm font-medium text-gray-700 mb-1">Số lượng kết quả trả về</label>
                        <select id="result-count" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                        </select>
                    </div> -->
                </div>
            </div>

            <!-- Bảng danh sách dịch vụ -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <h2 class="text-lg font-semibold text-gray-800 p-6 border-b border-gray-200">
                    Danh sách dịch vụ
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50">
                            <tr class="text-sm text-gray-600 uppercase">
                                <th class="py-3 px-6 font-medium">ID</th>
                                <th class="py-3 px-6 font-medium">Tên dịch vụ</th>
                                <th class="py-3 px-6 font-medium">Mô tả</th>
                                <th class="py-3 px-6 font-medium">Giá</th>
                                <th class="py-3 px-6 font-medium">Trạng thái</th>
                                <th class="py-3 px-6 font-medium text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="service-table-body" class="text-gray-700">
                            <!-- Service data will be loaded here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="/Js/dich_vu.js"></script>

    <!-- Create Service Modal -->
    <div id="create-service-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center pb-3">
                <h3 class="text-lg font-bold">Tạo dịch vụ mới</h3>
                <button id="close-create-service-modal" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <form id="new-service-form">
                <div class="mb-4">
                    <label for="new-service-name" class="block text-sm font-medium text-gray-700">Tên dịch vụ</label>
                    <input type="text" id="new-service-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="new-service-description" class="block text-sm font-medium text-gray-700">Mô tả</label>
                    <textarea id="new-service-description" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div class="mb-4">
                    <label for="new-service-price" class="block text-sm font-medium text-gray-700">Giá</label>
                    <input type="number" id="new-service-price" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required min="0">
                </div>
                <div class="mb-4">
                    <label for="new-service-is-active" class="block text-sm font-medium text-gray-700">Trạng thái hoạt động</label>
                    <input type="checkbox" id="new-service-is-active" class="mt-1">
                </div>
                <div class="flex justify-end">
                    <button type="button" id="cancel-new-service" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 mr-2">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Service Modal -->
    <div id="edit-service-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center pb-3">
                <h3 class="text-lg font-bold">Chỉnh sửa dịch vụ</h3>
                <button id="close-edit-service-modal" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <form id="edit-service-form">
                <input type="hidden" id="edit-service-id">
                <div class="mb-4">
                    <label for="edit-service-name" class="block text-sm font-medium text-gray-700">Tên dịch vụ</label>
                    <input type="text" id="edit-service-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="edit-service-description" class="block text-sm font-medium text-gray-700">Mô tả</label>
                    <textarea id="edit-service-description" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div class="mb-4">
                    <label for="edit-service-price" class="block text-sm font-medium text-gray-700">Giá</label>
                    <input type="number" id="edit-service-price" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required min="0">
                </div>
                <div class="mb-4">
                    <label for="edit-service-is-active" class="block text-sm font-medium text-gray-700">Trạng thái hoạt động</label>
                    <input type="checkbox" id="edit-service-is-active" class="mt-1">
                </div>
                <div class="flex justify-end">
                    <button type="button" id="cancel-edit-service" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 mr-2">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Service Detail Modal -->
    <div id="service-detail-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-1/2 lg:w-1/3 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center pb-3">
                <h3 class="text-lg font-bold">Thông tin chi tiết dịch vụ</h3>
                <button id="close-service-detail-modal" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <div id="service-detail-content" class="mt-4 text-gray-700">
                <p><strong>ID:</strong> <span id="detail-service-id"></span></p>
                <p><strong>Tên dịch vụ:</strong> <span id="detail-service-name"></span></p>
                <p><strong>Mô tả:</strong> <span id="detail-service-description"></span></p>
                <p><strong>Giá:</strong> <span id="detail-service-price"></span></p>
                <p><strong>Trạng thái:</strong> <span id="detail-service-is-active"></span></p>
            </div>
            <div class="flex justify-end mt-4">
                <button id="close-service-detail-btn" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400">Đóng</button>
            </div>
        </div>
    </div>

</body>
