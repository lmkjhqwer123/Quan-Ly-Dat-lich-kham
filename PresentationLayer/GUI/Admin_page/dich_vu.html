<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dịch Vụ - UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Màu nền xám nhẹ */
        }
        /* Style cho các nút hành động trong bảng */
        .btn-action {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.875rem; /* 14px */
            font-weight: 500;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }
        .btn-edit {
            border-color: #34D399; /* Màu xanh lá */
            color: #34D399;
        }
        .btn-edit:hover {
            background-color: #F0FDF4;
        }
        .btn-doctors {
            border-color: #3B82F6; /* Màu xanh dương */
            color: #3B82F6;
        }
        .btn-doctors:hover {
            background-color: #EFF6FF;
        }
        .btn-delete {
            border-color: #EF4444; /* Màu đỏ */
            color: #EF4444;
        }
        .btn-delete:hover {
            background-color: #FEF2F2;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="header-placeholder"></div>

    <!-- Nội dung chính -->
    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Quản lý dịch vụ</h1>

            <!-- Bộ lọc tìm kiếm -->
            <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Bộ lọc tìm kiếm</h2>
                
                <!-- Hàng 1: Tìm kiếm & Nút -->
                <div class="flex flex-wrap items-center gap-4 mb-4">
                    <div class="relative flex-grow" style="min-width: 300px;">
                        <input type="text" placeholder="Bạn đang cần tìm gì?" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <button class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors">
                        Tìm kiếm
                    </button>
                    <button class="px-6 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-600 transition-colors">
                        Làm mới
                    </button>
                    <button class="px-6 py-2 bg-gray-700 text-white font-semibold rounded-md hover:bg-gray-800 transition-colors">
                        Tạo mới
                    </button>
                </div>

                <!-- Hàng 2: Các bộ lọc Dropdown -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="sort-direction" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo chiều</label>
                        <select id="sort-direction" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="asc">Từ trên xuống dưới</option>
                            <option value="desc">Từ dưới lên trên</option>
                        </select>
                    </div>
                    <div>
                        <label for="sort-value" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo giá trị</label>
                        <select id="sort-value" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Chọn...</option>
                            <option value="id">ID</option>
                            <option value="name">Tên</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Bảng danh sách dịch vụ -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <h2 class="text-lg font-semibold text-gray-800 p-6 border-b border-gray-200">
                    Danh sách dịch vụ
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50">
                            <tr class="text-sm text-gray-600 uppercase">
                                <th class="py-3 px-6 font-medium"></th>
                                <th class="py-3 px-6 font-medium">ID</th>
                                <th class="py-3 px-6 font-medium">Name</th>
                                <th class="py-3 px-6 font-medium">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700">
                            <!-- Dữ liệu mẫu 1 -->
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-4 px-6">
                                    <img class="h-14 w-24 object-cover rounded-md" src="https://placehold.co/100x60/EBF8FF/3182CE?text=Dich+Vu" alt="Avatar">
                                </td>
                                <td class="py-4 px-6 font-medium">1</td>
                                <td class="py-4 px-6 font-medium">Khám sức khỏe tổng quát</td>
                                <td class="py-4 px-6 text-center space-x-2">
                                    <button class="btn-action btn-edit">Sửa thông tin</button>
                                    <button class="btn-action btn-doctors">Danh sách bác sĩ</button>
                                    <button class="btn-action btn-delete">Xoá</button>
                                </td>
                            </tr>
                            
                            <!-- Dữ liệu mẫu 2 -->
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-4 px-6">
                                    <img class="h-14 w-24 object-cover rounded-md" src="https://placehold.co/100x60/FEF2F2/EF4444?text=Dich+Vu" alt="Avatar">
                                </td>
                                <td class="py-4 px-6 font-medium">5</td>
                                <td class="py-4 px-6 font-medium">Phục hồi chấn thương</td>
                                <td class="py-4 px-6 text-center space-x-2">
                                    <button class="btn-action btn-edit">Sửa thông tin</button>
                                    <button class="btn-action btn-doctors">Danh sách bác sĩ</button>
                                    <button class="btn-action btn-delete">Xoá</button>
                                </td>
                            </tr>
                            
                            <!-- Dữ liệu mẫu 3 -->
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-4 px-6">
                                    <img class="h-14 w-24 object-cover rounded-md" src="https://placehold.co/100x60/ECFDF5/10B981?text=Dich+Vu" alt="Avatar">
                                </td>
                                <td class="py-4 px-6 font-medium">6</td>
                                <td class="py-4 px-6 font-medium">Khám tim mạch</td>
                                <td class="py-4 px-6 text-center space-x-2">
                                    <button class="btn-action btn-edit">Sửa thông tin</button>
                                    <button class="btn-action btn-doctors">Danh sách bác sĩ</button>
                                    <button class="btn-action btn-delete">Xoá</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="/Js/main.js"></script>
</body>
