<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Yêu Cầu Nghỉ Phép - UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Màu nền xám nhẹ */
        }
        /* Style cho modal */
        .modal {
            display: none;
        }
        .modal.active {
            display: flex;
        }
        /* Style cho các nút hành động trong bảng */
        .btn-action {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.875rem; /* 14px */
            font-weight: 500;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }
        .btn-view {
            border-color: #3B82F6; /* Màu xanh dương */
            color: #3B82F6;
        }
        .btn-view:hover {
            background-color: #EFF6FF;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Nội dung chính -->
    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Quản lý Yêu cầu Nghỉ phép</h1>

            <!-- Bộ lọc tìm kiếm -->
            <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Bộ lọc tìm kiếm</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="md:col-span-2">
                        <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Tìm kiếm</label>
                        <input type="text" id="search" placeholder="Tìm theo tên bác sĩ, chuyên khoa..." class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
                        <select id="status" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all" selected>Tất cả</option>
                            <option value="pending">Đang chờ duyệt</option>
                            <option value="approved">Đã phê duyệt</option>
                            <option value="rejected">Đã từ chối</option>
                        </select>
                    </div>
                    <div>
                        <label for="date-range" class="block text-sm font-medium text-gray-700 mb-1">Ngày nghỉ</label>
                        <input type="date" id="date-range" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <!-- Bảng danh sách yêu cầu chờ duyệt -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <h2 class="text-lg font-semibold text-gray-800 p-6 border-b border-gray-200">
                    Danh sách chờ duyệt
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50">
                            <tr class="text-sm text-gray-600 uppercase">
                                <th class="py-3 px-6 font-medium">Bác sĩ</th>
                                <th class="py-3 px-6 font-medium">Chuyên khoa</th>
                                <th class="py-3 px-6 font-medium">Ngày nghỉ</th>
                                <th class="py-3 px-6 font-medium">Lý do (Tóm tắt)</th>
                                <th class="py-3 px-6 font-medium text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700" id="leave-requests-table-body">
                            <!-- Dữ liệu yêu cầu nghỉ phép sẽ được tải bởi JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Dynamic Modal for Leave Request Details -->
    <div id="leave-detail-modal" class="modal fixed inset-0 bg-gray-600 bg-opacity-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl p-6 rounded-lg shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-semibold text-gray-800">Chi tiết Yêu cầu Nghỉ phép</h3>
                <button class="text-gray-400 hover:text-gray-700" onclick="closeModal('leave-detail-modal')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Cột thông tin yêu cầu -->
                <div class="space-y-4">
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">ID Yêu cầu</h4>
                        <p class="text-lg font-semibold text-gray-800" id="modal-leave-id"></p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">Bác sĩ</h4>
                        <p class="text-lg font-semibold text-gray-800" id="modal-doctor-name"></p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">Chuyên khoa</h4>
                        <p class="text-lg font-semibold text-gray-800" id="modal-specialty-name"></p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">Loại nghỉ</h4>
                        <p class="text-lg font-semibold text-gray-800" id="modal-leave-type"></p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">Thời gian bắt đầu</h4>
                        <p class="text-lg font-semibold text-gray-800" id="modal-start-datetime"></p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">Thời gian kết thúc</h4>
                        <p class="text-lg font-semibold text-gray-800" id="modal-end-datetime"></p>
                    </div>
                     <div>
                        <h4 class="text-sm font-medium text-gray-500">Lý do</h4>
                        <p class="text-gray-700 p-3 bg-gray-50 rounded-md border" id="modal-reason"></p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">Trạng thái</h4>
                        <p class="text-lg font-semibold text-gray-800" id="modal-status"></p>
                    </div>
                </div>
                
                <!-- Cột Hành động -->
                <div class="space-y-4">
                    <h4 class="text-lg font-medium text-gray-800">Hành động</h4>
                    <button class="w-full px-4 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-colors">Phê duyệt</button>
                    <button class="w-full px-4 py-3 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition-colors">Từ chối</button>
                    <button class="w-full px-4 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition-colors">Yêu cầu làm rõ</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/Js/quan_ly_lich_lam_viec.js"></script>
</body>
</html>
