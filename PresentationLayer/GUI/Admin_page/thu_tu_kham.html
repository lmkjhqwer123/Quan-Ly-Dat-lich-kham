<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thứ tự khám - UMBRELLA CORP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="p-6">
    <div id="header-placeholder"></div>
    <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Thứ tự khám</h1>



        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <h2 class="text-lg font-semibold text-gray-800 p-6 border-b border-gray-200">
                Danh sách bệnh nhân chờ khám
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                        <tr class="text-sm text-gray-600 uppercase">
                            <th class="py-3 px-6 font-medium">STT</th>
                            <th class="py-3 px-6 font-medium">Bệnh nhân</th>
                            <th class="py-3 px-6 font-medium">Giờ hẹn</th>
                            <th class="py-3 px-6 font-medium">Chuyên khoa</th>
                            <th class="py-3 px-6 font-medium">Bác sĩ</th>
                            <th class="py-3 px-6 font-medium">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="queue-table-body" class="text-gray-700">
                        <!-- Dữ liệu sẽ được tải bởi JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/Js/main.js"></script>
    <script src="/Js/thu_tu_kham.js"></script>
</body>
</html>
