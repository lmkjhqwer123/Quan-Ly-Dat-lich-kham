<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sắp Xếp Thứ Tự Khám - UMBRELLA CORP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Màu nền xám nhẹ */
        }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Thứ tự lịch khám</h1>

        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Bộ lọc tìm kiếm</h2>

            <div class="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-2 mb-6">
                <input id="search-input" type="text" placeholder="Bạn đang cần tìm gì?" class="flex-grow px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="search-button" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">Tìm kiếm</button>
                <button id="refresh-button" class="px-4 py-2 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 transition-colors">Làm mới</button>
                <button class="px-4 py-2 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 transition-colors">Tạo mới</button>
                <button class="px-4 py-2 bg-yellow-600 text-white font-semibold rounded-lg hover:bg-yellow-700 transition-colors">Sắp xếp thứ tự</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label for="sort-direction" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo chiều</label>
                    <select id="sort-direction" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="DESC">Từ trên xuống dưới</option>
                        <option value="ASC">Từ dưới lên trên</option>
                    </select>
                </div>
                <div>
                    <label for="sort-value" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo giá trị</label>
                    <select id="sort-value" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="appointment_datetime">Thứ tự lịch khám</option>
                        <option value="patient_name">Tên bệnh nhân</option>
                        </select>
                </div>
                <div>
                    <label for="sort-status" class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
                    <select id="sort-status" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" disabled selected>Chọn...</option>
                        <option value="pending">Chờ xử lý</option>
                        <option value="confirmed">Xác nhận</option>
                        <option value="cancelled">Hủy bỏ</option>
                        <option value="completed">Hoàn thành</option>
                    </select>
                </div>
                <div>
                    <label for="exam-date" class="block text-sm font-medium text-gray-700 mb-1">Ngày</label>
                    <input type="date" id="exam-date" value="2023-02-15" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="select-speciality" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp chuyên khoa</label>
                    <select id="select-speciality" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" disabled selected>Chọn...</option>
                        <option value="noi-tong-hop">Nội tổng hợp</option>
                        <option value="da-lieu">Da liễu</option>
                        <option value="rang-ham-mat">Răng - Hàm - Mặt</option>
                    </select>
                </div>
                <div>
                    <label for="select-doctor" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo bác sĩ</label>
                    <select id="select-doctor" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" disabled selected>Chọn...</option>
                        <option value="nguyen-thu-trang">Nguyễn Thị Thu Trang</option>
                        <option value="tran-van-nam">Trần Văn Nam</option>
                        <option value="le-thi-hoa">Lê Thị Hoa</option>
                    </select>
                </div>
                <div>
                    <label for="select-service" class="block text-sm font-medium text-gray-700 mb-1">Sắp xếp theo dịch vụ</label>
                    <select id="select-service" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" disabled selected>Chọn...</option>
                        <option value="1">Khám tổng quát</option>
                        <option value="2">Xét nghiệm máu</option>
                        <option value="3">Siêu âm bụng</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label for="select-limit" class="block text-sm font-medium text-gray-700 mb-1">Số lượng kết quả trả về</label>
                    <select id="select-limit" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <h2 class="text-lg font-semibold text-gray-800 p-6">Danh sách khám bệnh -- Ngày: 2023-02-15</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr class="text-sm text-gray-600 uppercase">
                            <th class="py-3 px-6 font-medium">Ngày khám</th>
                            <th class="py-3 px-6 font-medium">Họ tên</th>
                            <th class="py-3 px-6 font-medium">Chuyên khoa</th>
                            <th class="py-3 px-6 font-medium">Nguyên nhân</th>
                            <th class="py-3 px-6 font-medium">Phòng khám</th>
                            <th class="py-3 px-6 font-medium">Tình trạng</th>
                            <th class="py-3 px-6 font-medium">Khác</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700">
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-4 px-6">2023-02-15</td>
                            <td class="py-4 px-6">Tiểu Long Nữ<br><span class="text-xs text-gray-500">Ngày sinh: 2022-05-01</span></td>
                            <td class="py-4 px-6">Nội tổng hợp</td>
                            <td class="py-4 px-6">KHÁM SỨC KHỎE</td>
                            <td class="py-4 px-6">Phòng 104</td>
                            <td class="py-4 px-6"><span class="inline-block bg-yellow-100 text-yellow-800 text-xs font-semibold px-2 py-0.5 rounded-full">Hủy bỏ</span></td>
                            <td class="py-4 px-6">
                                <button class="text-purple-600 hover:text-purple-800 text-sm font-medium">Khác</button>
                            </td>
                        </tr>
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-4 px-6 text-green-600">2023-02-15</td>
                            <td class="py-4 px-6 font-medium text-green-600">Tiểu Long Nữ</td>
                            <td class="py-4 px-6">Nội tổng hợp</td>
                            <td class="py-4 px-6 text-green-600">alo</td>
                            <td class="py-4 px-6">Phòng 104</td>
                            <td class="py-4 px-6"><span class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded-full">Đang khám</span></td>
                            <td class="py-4 px-6">
                                <button class="text-purple-600 hover:text-purple-800 text-sm font-medium">Khác</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
