<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân của tôi - UMBRELLA CORP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Đảm bảo tất cả input fields dùng Inter font */
        input, select, textarea, label {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Thông tin cá nhân của tôi</h1>

        <div id="doctor-profile-content" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Doctor profile details will be loaded here by JavaScript -->
            <div class="md:col-span-2 text-center">
                <img id="doctor-avatar" src="https://via.placeholder.com/150" alt="Avatar Bác sĩ" class="w-32 h-32 rounded-full mx-auto mb-4 object-cover">
            </div>
            <div>
                <p class="text-gray-600"><strong>Họ và tên:</strong></p>
                <p id="doctor-full-name" class="text-lg font-medium text-gray-900"></p>
            </div>
            <div>
                <p class="text-gray-600"><strong>Email:</strong></p>
                <p id="doctor-email" class="text-lg font-medium text-gray-900"></p>
            </div>
            <div>
                <p class="text-gray-600"><strong>Số điện thoại:</strong></p>
                <p id="doctor-phone" class="text-lg font-medium text-gray-900"></p>
            </div>
            <div>
                <p class="text-gray-600"><strong>Chuyên khoa:</strong></p>
                <p id="doctor-specialty" class="text-lg font-medium text-gray-900"></p>
            </div>
            <div>
                <p class="text-gray-600"><strong>Bằng cấp:</strong></p>
                <p id="doctor-qualifications" class="text-lg font-medium text-gray-900"></p>
            </div>
            <div>
                <p class="text-gray-600"><strong>Vai trò:</strong></p>
                <p id="doctor-role" class="text-lg font-medium text-gray-900"></p>
            </div>
            <div class="md:col-span-2 mt-6">
                <button id="edit-profile-btn" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors">
                    Chỉnh sửa thông tin
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Chỉnh sửa thông tin cá nhân</h3>
                <div class="mt-2 px-7 py-3">
                    <form id="edit-doctor-form">
                        <input type="hidden" id="edit-doctor-id">
                        <input type="text" id="edit-full-name" placeholder="Họ tên" class="w-full px-3 py-2 mb-3 text-sm leading-tight text-gray-700 border rounded shadow appearance-none focus:outline-none focus:shadow-outline">
                        <input type="email" id="edit-email" placeholder="Email" class="w-full px-3 py-2 mb-3 text-sm leading-tight text-gray-700 border rounded shadow appearance-none focus:outline-none focus:shadow-outline" readonly>
                        <input type="text" id="edit-phone" placeholder="Số điện thoại" class="w-full px-3 py-2 mb-3 text-sm leading-tight text-gray-700 border rounded shadow appearance-none focus:outline-none focus:shadow-outline">
                        <select id="edit-specialty" class="w-full px-3 py-2 mb-3 text-sm leading-tight text-gray-700 border rounded shadow appearance-none focus:outline-none focus:shadow-outline"></select>
                        <input type="text" id="edit-qualifications" placeholder="Bằng cấp" class="w-full px-3 py-2 mb-3 text-sm leading-tight text-gray-700 border rounded shadow appearance-none focus:outline-none focus:shadow-outline">
                    </form>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="save-profile-btn" class="px-4 py-2 bg-green-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-300">
                        Lưu thay đổi
                    </button>
                    <button id="cancel-edit-btn" class="px-4 py-2 bg-gray-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-300 mt-2">
                        Hủy
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/Js/doctor_bac_si.js"></script>
</body>
</html>
