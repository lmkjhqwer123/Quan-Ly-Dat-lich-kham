<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Về Chúng Tôi - Hệ Thống Quản Lý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Đảm bảo tất cả input fields dùng Inter font */
        input, select, textarea, label {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
</head>
<body class="bg-gray-50">

    <div id="profile-page">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-6xl mx-auto md:grid md:grid-cols-4 md:gap-8">
            
            <!-- Menu bên trái -->
            <aside class="md:col-span-1 mb-8 md:mb-0">
                <div class="bg-white p-4 rounded-xl shadow-sm sticky top-4 border border-gray-100">
                    <div class="flex items-center space-x-3 mb-6 px-2">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                            <i class="fas fa-user font-bold"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500">Xin chào,</p>
                            <h2 class="text-sm font-bold text-gray-800">Nguyễn Văn A</h2>
                        </div>
                    </div>
                    
                    <nav class="space-y-1" id="sidebar-nav">
                        <a href="profile.html" class="nav-link group flex items-center px-3 py-3 text-sm font-medium text-gray-600 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all">
                            <i class="fas fa-user-circle w-6 text-lg group-hover:scale-110 transition-transform"></i>
                            <span>Thông tin cá nhân</span>
                        </a>
                        <a href="medical_history.html" class="nav-link group flex items-center px-3 py-3 text-sm font-medium text-gray-600 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all">
                            <i class="fas fa-file-medical w-6 text-lg group-hover:scale-110 transition-transform"></i>
                            <span>Lịch sử bệnh án</span>
                        </a>
                        <a href="reminders.html" class="nav-link group flex items-center px-3 py-3 text-sm font-medium text-gray-600 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all">
                            <i class="fas fa-bell w-6 text-lg group-hover:scale-110 transition-transform"></i>
                            <span>Nhắc nhở</span>
                        </a>
                        <a href="medical_guide.html" class="nav-link group flex items-center px-3 py-3 text-sm font-medium text-gray-600 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all">
                            <i class="fas fa-book-medical w-6 text-lg group-hover:scale-110 transition-transform"></i>
                            <span>Hướng dẫn khám</span>
                        </a>
                        <a href="about_us.html" class="nav-link group flex items-center px-3 py-3 text-sm font-medium text-blue-700 bg-blue-50 rounded-lg transition-all">
                            <i class="fas fa-info-circle w-6 text-lg"></i>
                            <span>Về chúng tôi</span>
                        </a>
                    </nav>
                </div>
            </aside>

            <!-- Nội dung bên phải -->
            <div class="md:col-span-3">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h1 class="text-2xl font-bold text-gray-900 mb-4 border-b pb-3">Về chúng tôi</h1>
                    
                    <!-- Nội dung ví dụ -->
                    <div class="space-y-4">
                        <p class="text-gray-600">Thông tin về chúng tôi.</p>
                        <!-- Thêm nội dung về chúng tôi ở đây -->
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    </div>


    <script src="/Js/main.js"></script>
    <script>
        // Tự động đánh dấu link active
        function setActiveNav() {
            const currentPage = window.location.pathname.split('/').pop() || 'profile.html';
            const navLinks = document.querySelectorAll('#sidebar-nav .nav-link');
            
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                
                // Xóa active styles
                link.classList.remove('text-blue-600', 'bg-blue-50');
                link.classList.add('text-gray-700');
                
                // Thêm active style nếu là trang hiện tại
                if (href === currentPage) {
                    link.classList.remove('text-gray-700');
                    link.classList.add('text-blue-600', 'bg-blue-50');
                }
            });
        }
        
        // Chạy khi DOM loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setActiveNav);
        } else {
            setActiveNav();
        }
    </script>
</html>
