<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Hẹn - UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Tùy chỉnh màu viền khi focus cho hợp với theme */
        input:focus, select:focus, textarea:focus {
            border-color: #2dd4bf !important; /* Màu teal-400 */
            box-shadow: 0 0 0 2px #99f6e4; /* Màu teal-200 */
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <div class="flex flex-col min-h-screen">
        <!-- Header Placeholder -->
        <div id="header-placeholder"></div>

        <!-- Main Content -->
        <main class="flex-grow py-8 sm:py-12">
            <div class="max-w-4xl mx-auto px-4">
                
                <div class="bg-white p-6 sm:p-10 rounded-xl shadow-lg">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-8">Nội dung chi tiết đặt hẹn</h1>
                    
                    <form action="#" method="POST">
                        <div class="space-y-6">
                            <!-- Chi tiết khám -->
                            <div>
                                <h2 class="text-xl font-semibold text-gray-800 mb-4">Chi tiết khám</h2>
                                <div class="grid grid-cols-1 gap-6">
                                    <div>
                                        <label for="clinic" class="block text-sm font-medium text-gray-700 mb-1">Bệnh viện/phòng khám <span class="text-red-500">*</span></label>
                                        <select id="clinic" name="clinic" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                            <option value="" disabled selected>Chọn cơ sở khám</option>
                                            <option value="cs1">Cơ sở 1 - Hà Nội</option>
                                            <option value="cs2">Cơ sở 2 - TP. HCM</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="speciality" class="block text-sm font-medium text-gray-700 mb-1">Chuyên khoa <span class="text-red-500">*</span></label>
                                        <select id="speciality" name="speciality" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                            <option value="" disabled selected>Chọn chuyên khoa</option>
                                            <!-- Dữ liệu chuyên khoa sẽ được tải từ CSDL -->
                                        </select>
                                    </div>
                                    <div>
                                        <label for="doctor" class="block text-sm font-medium text-gray-700 mb-1">Bác sĩ</label>
                                        <select id="doctor" name="doctor" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                            <option value="" disabled selected>Chọn Bác sĩ muốn khám</option>
                                            <!-- Dữ liệu bác sĩ sẽ được tải từ CSDL -->
                                        </select>
                                    </div>
                                    <div class="flex items-center">
                                        <input id="foreigner" name="foreigner" type="checkbox" class="h-4 w-4 text-teal-500 border-gray-300 rounded focus:ring-teal-400">
                                        <label for="foreigner" class="ml-2 block text-sm text-gray-900">Đặt hẹn cho người nước ngoài</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Thời gian khám -->
                            <div>
                                <h2 class="text-xl font-semibold text-gray-800 mb-4">Thời gian khám <span class="text-red-500">*</span></h2>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <!-- Nút này được chọn -->
                                    <button type="button" class="bg-teal-500 text-white p-3 rounded-lg text-center shadow">
                                        <span class="font-semibold block">31/10</span>
                                        <span class="text-sm">Thứ 6</span>
                                    </button>
                                    <!-- Nút không được chọn -->
                                    <button type="button" class="bg-gray-100 text-gray-700 p-3 rounded-lg text-center hover:bg-gray-200">
                                        <span class="font-semibold block">01/11</span>
                                        <span class="text-sm">Thứ 7</span>
                                    </button>
                                    <button type="button" class="bg-gray-100 text-gray-700 p-3 rounded-lg text-center hover:bg-gray-200">
                                        <span class="font-semibold block">02/11</span>
                                        <span class="text-sm">Chủ nhật</span>
                                    </button>
                                    <button type="button" class="bg-gray-100 text-gray-700 p-3 rounded-lg text-center hover:bg-gray-200 flex items-center justify-center space-x-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                        <span class="font-semibold">Ngày khác</span>
                                    </button>
                                </div>
                                <p class="text-sm text-gray-500 mt-3">*Lưu ý: Tổng đài viên sẽ gọi lại cho quý khách để xác nhận thông tin thời gian dựa theo đăng ký và điều chỉnh nếu cần thiết.</p>
                            </div>

                            <!-- Thông tin khách hàng -->
                            <div>
                                <h2 class="text-xl font-semibold text-gray-800 mb-4">Thông tin khách hàng</h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="md:col-span-2">
                                        <label for="full-name" class="block text-sm font-medium text-gray-700 mb-1">Họ và tên <span class="text-red-500">*</span></label>
                                        <input type="text" name="full-name" id="full-name" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Giới tính <span class="text-red-500">*</span></label>
                                        <div class="flex items-center space-x-6 mt-2">
                                            <div class="flex items-center">
                                                <input id="male" name="gender" type="radio" checked class="h-4 w-4 text-teal-500 border-gray-300 focus:ring-teal-400">
                                                <label for="male" class="ml-2 block text-sm text-gray-900">Nam</label>
                                            </div>
                                            <div class="flex items-center">
                                                <input id="female" name="gender" type="radio" class="h-4 w-4 text-teal-500 border-gray-300 focus:ring-teal-400">
                                                <label for="female" class="ml-2 block text-sm text-gray-900">Nữ</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label for="dob" class="block text-sm font-medium text-gray-700 mb-1">Ngày tháng năm sinh <span class="text-red-500">*</span></label>
                                        <input type="date" name="dob" id="dob" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                    </div>
                                    <div>
                                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại <span class="text-red-500">*</span></label>
                                        <input type="tel" name="phone" id="phone" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                    </div>
                                    <div>
                                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                        <input type="email" name="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label for="reason" class="block text-sm font-medium text-gray-700 mb-1">Lý do khám <span class="text-red-500">*</span></label>
                                        <textarea id="reason" name="reason" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none"></textarea>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Điều khoản -->
                            <div class="flex items-start">
                                <input id="terms" name="terms" type="checkbox" class="h-4 w-4 text-teal-500 border-gray-300 rounded focus:ring-teal-400 mt-1">
                                <label for="terms" class="ml-2 block text-sm text-gray-900">
                                    Tôi đã đọc và đồng ý với <a href="#" class="font-medium text-blue-600 hover:underline">Chính sách bảo vệ dữ liệu cá nhân</a> và chấp thuận để UMBRELLA CORP xử lý dữ liệu cá nhân của tôi theo quy định của pháp luật về bảo vệ dữ liệu cá nhân. <span class="text-red-500">*</span>
                                </label>
                            </div>
                        </div>

                        <!-- Nút Gửi -->
                        <div class="mt-10 text-center">
                            <button type="submit" class="bg-teal-500 text-white font-semibold py-3 px-12 rounded-full hover:bg-teal-600 transition duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400">
                                Gửi thông tin
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>

        <!-- Footer Placeholder -->
        <div id="footer-placeholder"></div>
    </div>

    <script src="/Js/main.js"></script>
</body>
</html>
