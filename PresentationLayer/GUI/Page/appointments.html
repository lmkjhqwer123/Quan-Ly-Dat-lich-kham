<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Hẹn - UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Đảm bảo tất cả input fields dùng Inter font */
        input, select, textarea, label {
            font-family: 'Inter', sans-serif !important;
        }
        /* Tùy chỉnh màu viền khi focus cho hợp với theme */
        input:focus, select:focus, textarea:focus {
            border-color: #2dd4bf !important; /* Màu teal-400 */
            box-shadow: 0 0 0 2px #99f6e4; /* Màu teal-200 */
        }
        /* CSS cho lịch tháng */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(40px, auto); /* Adjusted for smaller calendar in appointments */
            max-height: 240px; /* 6 rows * 40px/row = 240px */
            overflow: hidden;
        }
        .calendar-day {
            min-height: 40px; /* Ensure a minimum height for content */
            height: auto;
            padding: 4px;
            vertical-align: top;
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            background-color: #ffffff;
            transition: background-color 0.2s;
            cursor: pointer; /* Add cursor for clickable days */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .calendar-day:hover {
            background-color: #f9fafb;
        }
        .calendar-day-other-month {
            background-color: #f9fafb;
            color: #9ca3af;
            cursor: not-allowed; /* Indicate non-clickable */
        }
        .day-number {
            font-weight: 500;
            margin-bottom: 2px;
            font-size: 0.875rem; /* text-sm */
        }
        .calendar-day.selected {
            background-color: #2dd4bf; /* teal-400 */
            color: white;
            font-weight: 700;
        }
        .calendar-day.selected .day-number {
            color: white;
        }
        .calendar-day-header {
            padding: 8px;
            text-align: center;
            font-weight: 600;
            color: #4b5563; /* text-gray-700 */
            background-color: #f3f4f6; /* bg-gray-100 */
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }
        .calendar-day-header:last-child {
            border-right: none;
        }
        .calendar-grid .calendar-day:nth-child(7n) {
            border-right: none;
        }
        /* New styles for booked days and time slots */
        .fully-booked-day {
            background-color: #fca5a5; /* Red-300 */
            color: #b91c1c; /* Red-700 */
            cursor: not-allowed;
        }
        .fully-booked-day .day-number {
            color: #b91c1c;
        }
        .booked-time-slot {
            background-color: #fca5a5; /* Red-300 */
            color: #b91c1c; /* Red-700 */
            cursor: not-allowed;
            border-color: #ef4444; /* Red-500 */
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <div class="flex flex-col min-h-screen">
        <!-- Header Placeholder -->
        <div id="header-placeholder"></div>

        <!-- Main Content -->
        <main class="flex-grow py-8 sm:py-12">
            <div class="max-w-4xl mx-auto px-4">
                
                <div class="bg-white p-6 sm:p-10 rounded-xl shadow-lg">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-8">Nội dung chi tiết đặt hẹn</h1>
                    
                    <!-- Thông báo thành công/lỗi -->
                    <div id="form-message" class="hidden mb-6 p-4 rounded-md"></div>

                    <form id="booking-form">
                        <div class="space-y-6">
                            <!-- Chi tiết khám -->
                            <div>
                                <h2 class="text-xl font-semibold text-gray-800 mb-4">Chi tiết khám</h2>
                                <div class="grid grid-cols-1 gap-6">
                                    <div>
                                        <label for="speciality" class="block text-sm font-medium text-gray-700 mb-1">Chuyên khoa <span class="text-red-500">*</span></label>
                                        <select id="specialty" name="specialty" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none">
                                            <option value="" disabled selected>Chọn chuyên khoa</option>
                                            <!-- Dữ liệu sẽ được tải bằng JS -->
                                        </select>
                                    </div>
                                    <div>
                                        <label for="doctor" class="block text-sm font-medium text-gray-700 mb-1">Bác sĩ</label>
                                        <select id="doctor" name="doctor" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none bg-gray-100" disabled>
                                            <option value="" disabled selected>Vui lòng chọn chuyên khoa trước</option>
                                            <!-- Dữ liệu sẽ được tải sau khi chọn chuyên khoa -->
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Thời gian khám -->
                            <div>
                                <h2 class="text-xl font-semibold text-gray-800 mb-4">Thời gian khám</h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Chọn ngày <span class="text-red-500">*</span></label>
                                        <!-- Thanh điều khiển tháng -->
                                        <div class="bg-white p-2 rounded-t-lg flex justify-between items-center border border-gray-300 border-b-0">
                                            <button type="button" id="prev-month" class="px-3 py-1 bg-gray-200 text-gray-700 font-medium rounded-md hover:bg-gray-300 text-sm">
                                                &larr;
                                            </button>
                                            <h3 id="month-year" class="text-base font-semibold text-gray-800"></h3>
                                            <button type="button" id="next-month" class="px-3 py-1 bg-gray-200 text-gray-700 font-medium rounded-md hover:bg-gray-300 text-sm">
                                                &rarr;
                                            </button>
                                        </div>
                                        <!-- Lịch dạng tháng -->
                                        <div class="bg-white rounded-b-lg shadow-sm overflow-hidden border border-gray-300">
                                            <!-- Hàng tiêu đề các ngày trong tuần -->
                                            <div class="grid grid-cols-7 text-center text-sm font-medium text-gray-600 bg-gray-100 border-b border-gray-200">
                                                <div class="p-2">CN</div>
                                                <div class="p-2">T2</div>
                                                <div class="p-2">T3</div>
                                                <div class="p-2">T4</div>
                                                <div class="p-2">T5</div>
                                                <div class="p-2">T6</div>
                                                <div class="p-2">T7</div>
                                            </div>
                                            <!-- Các hàng ngày trong tháng -->
                                            <div id="calendar-grid" class="calendar-grid">
                                                <!-- Các ngày sẽ được chèn bằng JS -->
                                            </div>
                                        </div>
                                        <input type="hidden" id="appointment-date" name="appointment-date" required>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Chọn giờ <span class="text-red-500">*</span></label>
                                        <div id="appointment-time-selection" class="grid grid-cols-2 gap-2">
                                            <button type="button" class="time-slot-button px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400" data-time="07:00-09:00">7:00 - 9:00</button>
                                            <button type="button" class="time-slot-button px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400" data-time="09:00-11:00">9:00 - 11:00</button>
                                            <button type="button" class="time-slot-button px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400" data-time="13:00-15:00">13:00 - 15:00</button>
                                            <button type="button" class="time-slot-button px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400" data-time="15:00-17:00">15:00 - 17:00</button>
                                        </div>
                                        <input type="hidden" id="appointment-time" name="appointment-time" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Thông tin khách hàng -->
                            <div>
                                <h2 class="text-xl font-semibold text-gray-800 mb-4">Thông tin khách hàng</h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="md:col-span-2">
                                        <label for="full-name" class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
                                        <input type="text" name="full-name" id="full-name" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none bg-gray-100">
                                    </div>
                                    <div>
                                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                                        <input type="tel" name="phone" id="phone" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none bg-gray-100">
                                    </div>
                                    <div>
                                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                        <input type="email" name="email" id="email" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none bg-gray-100">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label for="reason" class="block text-sm font-medium text-gray-700 mb-1">Lý do khám <span class="text-red-500">*</span></label>
                                        <textarea id="reason" name="reason" rows="4" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none"></textarea>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Điều khoản -->
                            <div class="flex items-start">
                                <input id="terms" name="terms" type="checkbox" required class="h-4 w-4 text-teal-500 border-gray-300 rounded focus:ring-teal-400 mt-1">
                                <label for="terms" class="ml-2 block text-sm text-gray-900">
                                    Tôi đã đọc và đồng ý với <a href="#" class="font-medium text-blue-600 hover:underline">Chính sách bảo vệ dữ liệu cá nhân</a> và chấp thuận để UMBRELLA CORP xử lý dữ liệu cá nhân của tôi theo quy định của pháp luật về bảo vệ dữ liệu cá nhân. <span class="text-red-500">*</span>
                                </label>
                            </div>
                        </div>

                        <!-- Nút Gửi -->
                        <div class="mt-10 flex justify-center">
                            <button type="submit" class="bg-teal-500 text-white font-semibold py-3 px-12 rounded-full hover:bg-teal-600 transition duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400">
                                Gửi thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer Placeholder -->
        <div id="footer-placeholder"></div>
    </div>
    <script src="/Js/languages.js"></script>
    <script src="/Js/main.js"></script>
    <script src="/Js/appointments.js"></script>
</body>
</html>
