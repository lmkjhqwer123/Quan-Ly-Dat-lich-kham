<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Bác Sĩ - Chuyên Gia | UMBRELLA CORP</title>
    <!-- Tích hợp Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Màu nền xám nhẹ */
        }
        .filter-dropdown {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0;
        }
        .filter-dropdown a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }
        .filter-dropdown a:hover {
            background-color: #f1f1f1;
        }
        .dropdown-container:hover .filter-dropdown {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50 p-8">

    <div id="header-placeholder"></div>

                            <span>Lựa chọn cơ sở</span>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <!-- <div class="filter-dropdown">
                        <a href="#">Cơ sở 1</a>
                        <a href="#">Cơ sở 2</a>
                    </div> --></div>
                <!-- Dropdown 2: Yêu cầu chuyên môn --><div class="relative dropdown-container md:col-span-1">

                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>

            <div class="grid grid-cols-1 md:grid-cols-7 gap-4">

                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>

                <!-- Input: Nhập tên bác sĩ/chuyên gia --><div class="md:col-span-3">
                    <input type="text" placeholder="Nhập tên bác sĩ/chuyên gia..." class="w-full px-4 py-2 border rounded-lg bg-gray-50 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">

                <!-- Search Button --><div class="md:col-span-2">
                    <button class="w-full px-4 py-2 bg-teal-500 text-white font-semibold rounded-lg hover:bg-teal-600 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-teal-400">
