<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - Hệ Thống Quản Lý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-gray-50">

    <div id="profile-page">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-6xl mx-auto md:grid md:grid-cols-4 md:gap-8">
            
            <!-- Menu bên trái -->
            <aside class="md:col-span-1 mb-8 md:mb-0">
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2">Cá nhân</h2>
                    <nav class="space-y-1">
                        <a href="profile.html" class="block px-3 py-2 text-sm font-medium text-blue-600 rounded-md bg-gray-100">Thông tin cá nhân</a>
                        <a href="queue.html" class="block px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100">Hàng chờ khám</a>
                        <a href="medical_history.html" class="block px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100">Lịch sử khám bệnh</a>
                        <a href="reminders.html" class="block px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100">Nhắc nhở</a>
                        <a href="interface_settings.html" class="block px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100">Giao diện</a>
                        <a href="feedback.html" class="block px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100">Phản hồi</a>
                        <a href="medical_guide.html" class="block px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100">Hướng dẫn khám</a>
                        <a href="about_us.html" class="block px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100">Về chúng tôi</a>
                    </nav>
                </div>
            </aside>

            <!-- Nội dung bên phải -->
            <div class="md:col-span-3">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h1 class="text-2xl font-bold text-gray-900 mb-4 border-b pb-3">Thông tin cá nhân</h1>
                    
                    <div id="user-info" class="space-y-4">
                        <div>
                            <label class="text-sm font-medium text-gray-600">Họ và tên</label>
                            <p id="user-fullname" class="text-lg font-semibold text-gray-800"></p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Email</label>
                            <p id="user-email" class="text-lg text-gray-800"></p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Số điện thoại</label>
                            <p id="user-phone" class="text-lg text-gray-800"></p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Địa chỉ</label>
                            <p id="user-address" class="text-lg text-gray-800"></p>
                        </div>
                        <div class="pt-4">
                            <button id="edit-profile-btn" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">
                                Chỉnh sửa thông tin
                            </button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-backdrop hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
            <div class="p-6 border-b">
                <h2 class="text-xl font-bold">Chỉnh sửa thông tin cá nhân</h2>
            </div>
            <form id="edit-profile-form" class="p-6 space-y-4">
                <div>
                    <label for="edit-fullname" class="text-sm font-medium text-gray-700">Họ và Tên</label>
                    <input id="edit-fullname" type="text" required class="w-full px-4 py-2 mt-1 bg-gray-100 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="edit-email" class="text-sm font-medium text-gray-700">Email</label>
                    <input id="edit-email" type="email" required class="w-full px-4 py-2 mt-1 bg-gray-100 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="edit-phone" class="text-sm font-medium text-gray-700">Số điện thoại</label>
                    <input id="edit-phone" type="tel" required class="w-full px-4 py-2 mt-1 bg-gray-100 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="edit-address" class="text-sm font-medium text-gray-700">Địa chỉ</label>
                    <input id="edit-address" type="text" class="w-full px-4 py-2 mt-1 bg-gray-100 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="pt-4 border-t">
                    <h3 class="text-lg font-semibold">Đổi mật khẩu</h3>
                    <div class="space-y-4 mt-2">
                        <div>
                            <label for="current-password" class="text-sm font-medium text-gray-700">Mật khẩu hiện tại</label>
                            <input id="current-password" type="password" class="w-full px-4 py-2 mt-1 bg-gray-100 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="new-password" class="text-sm font-medium text-gray-700">Mật khẩu mới</label>
                            <input id="new-password" type="password" class="w-full px-4 py-2 mt-1 bg-gray-100 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="confirm-password" class="text-sm font-medium text-gray-700">Xác nhận mật khẩu mới</label>
                            <input id="confirm-password" type="password" class="w-full px-4 py-2 mt-1 bg-gray-100 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>
                <div id="edit-error-message" class="text-sm text-red-600 hidden text-center"></div>
                <div class="flex justify-end pt-4 space-x-2">
                    <button type="button" id="cancel-edit-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">Hủy</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', async () => {
    const token = sessionStorage.getItem('accessToken');

    if (!token) {
        window.location.href = 'login.html';
        return;
    }

    // helper: populate UI from user object
    function populateUI(user) {
        if (!user) return;
        document.getElementById('user-fullname').textContent = user.FullName || 'Chưa cập nhật';
        document.getElementById('user-email').textContent = user.Email || 'Chưa cập nhật';
        document.getElementById('user-phone').textContent = user.Phone || 'Chưa cập nhật';
        document.getElementById('user-address').textContent = user.address || user.address || 'Chưa cập nhật';
    }

    // try fetch real profile from API
    let user = null;
    try {
        const resp = await fetch('/api/patients/me', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/json'
            }
        });

        if (resp.ok) {
            user = await resp.json();
            // keep server copy in sessionStorage
            sessionStorage.setItem('loggedInUser', JSON.stringify(user));
        } else if (resp.status === 401 || resp.status === 403) {
            // token invalid / expired: force login
            sessionStorage.removeItem('accessToken');
            sessionStorage.removeItem('loggedInUser');
            window.location.href = 'login.html';
            return;
        } else {
            // other error: fallback to sessionStorage
            user = JSON.parse(sessionStorage.getItem('loggedInUser') || 'null');
        }
    } catch (e) {
        // network error: fallback to sessionStorage
        user = JSON.parse(sessionStorage.getItem('loggedInUser') || 'null');
    }

    populateUI(user);

    const modal = document.getElementById('edit-profile-modal');
    const editBtn = document.getElementById('edit-profile-btn');
    const cancelBtn = document.getElementById('cancel-edit-btn');
    const editForm = document.getElementById('edit-profile-form');
    const errorMessage = document.getElementById('edit-error-message');

    editBtn.addEventListener('click', () => {
        // ensure we use latest data (from sessionStorage or fetched user)
        const u = JSON.parse(sessionStorage.getItem('loggedInUser') || 'null') || user || {};
        document.getElementById('edit-fullname').value = u.FullName || '';
        document.getElementById('edit-email').value = u.Email || '';
        document.getElementById('edit-phone').value = u.Phone || '';
        document.getElementById('edit-address').value = u.address || '';
        modal.classList.remove('hidden');
    });

    cancelBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        editForm.reset();
        errorMessage.classList.add('hidden');
    });

    editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.classList.add('hidden');

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword && newPassword !== confirmPassword) {
            errorMessage.textContent = 'Mật khẩu mới không khớp.';
            errorMessage.classList.remove('hidden');
            return;
        }

        const profileData = {
            FullName: document.getElementById('edit-fullname').value,
            Email: document.getElementById('edit-email').value,
            Phone: document.getElementById('edit-phone').value,
            address: document.getElementById('edit-address').value,
        };

        try {
            const profileResponse = await fetch('/api/patients/me', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(profileData)
            });

            if (!profileResponse.ok) {
                const errorData = await profileResponse.json().catch(()=> ({}));
                throw new Error(errorData.detail || 'Lỗi cập nhật thông tin.');
            }

            // Update local user object and UI
            const updatedUser = JSON.parse(sessionStorage.getItem('loggedInUser') || 'null') || user || {};
            updatedUser.FullName = profileData.FullName;
            updatedUser.Email = profileData.Email;
            updatedUser.Phone = profileData.Phone;
            updatedUser.address = profileData.address;
            sessionStorage.setItem('loggedInUser', JSON.stringify(updatedUser));
            populateUI(updatedUser);

            const newPwd = document.getElementById('new-password').value;
            if (newPwd) {
                const passwordData = {
                    current_password: document.getElementById('current-password').value,
                    new_password: newPwd,
                    confirm_new_password: confirmPassword
                };

                const passwordResponse = await fetch('/api/users/me/password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(passwordData)
                });

                if (!passwordResponse.ok) {
                    const errorData = await passwordResponse.json().catch(()=> ({}));
                    throw new Error(errorData.detail || 'Lỗi đổi mật khẩu.');
                }
            }

            alert('Cập nhật thông tin thành công!');
            modal.classList.add('hidden');
            editForm.reset();

        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove('hidden');
        }
    });
});
</script>
    <script src="/Js/main.js"></script>
</body>
</html>
