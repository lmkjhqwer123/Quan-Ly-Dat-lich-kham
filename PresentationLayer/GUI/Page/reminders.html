<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo & Nhắc Nhở - Umbrella Medical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .timeline-line::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 20px;
            width: 2px;
            background-color: #E5E7EB;
            z-index: 0;
        }
        /* Custom Scrollbar cho container nếu cần */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">

    <div id="profile-page" class="min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-grow p-4 sm:p-6 lg:p-8">
        <div class="max-w-6xl mx-auto md:grid md:grid-cols-4 md:gap-8">
            
            <aside class="md:col-span-1 mb-8 md:mb-0 hidden md:block">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 sticky top-4">
                    <div class="flex items-center space-x-3 mb-6 px-2">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500">Xin chào,</p>
                            <h2 class="text-sm font-bold text-gray-900">Nguyễn Văn A</h2>
                        </div>
                    </div>
                    
                    <nav class="space-y-1" id="sidebar-nav">
                        <a href="profile.html" class="nav-link group flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all">
                            <i class="fas fa-user-circle w-6 text-gray-400 group-hover:text-blue-500"></i>
                            Thông tin cá nhân
                        </a>
                        <a href="medical_history.html" class="nav-link group flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all">
                            <i class="fas fa-file-medical w-6 text-gray-400 group-hover:text-blue-500"></i>
                            Lịch sử bệnh án
                        </a>
                        <a href="reminders.html" class="nav-link group flex items-center px-3 py-2.5 text-sm font-medium bg-blue-50 text-blue-700 rounded-lg border border-blue-100">
                            <i class="fas fa-bell w-6 text-blue-600"></i>
                            Nhắc nhở
                        </a>
                        <a href="medical_guide.html" class="nav-link group flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all">
                            <i class="fas fa-book-medical w-6 text-gray-400 group-hover:text-blue-500"></i>
                            Hướng dẫn khám
                        </a>
                        <a href="about_us.html" class="nav-link group flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-700 transition-all">
                            <i class="fas fa-info-circle w-6 text-gray-400 group-hover:text-blue-500"></i>
                            Về chúng tôi
                        </a>
                    </nav>
                </div>
            </aside>

            <div class="md:col-span-3">
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6 flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Thông Báo & Nhắc Nhở</h1>
                        <p class="text-sm text-gray-500 mt-1">Quản lý lịch hẹn sắp tới và các thông báo quan trọng.</p>
                    </div>
                    <div class="w-12 h-12 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600">
                        <i class="fas fa-bell ring-4 ring-indigo-50 rounded-full"></i>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 min-h-[400px] relative">

                    <div id="loading" class="flex flex-col items-center justify-center py-12">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
                        <p class="text-gray-500 text-sm">Đang đồng bộ dữ liệu...</p>
                    </div>
                    
                    <div id="reminders-container" class="space-y-0 relative" style="display: none;">
                        </div>
                    
                    <div id="pagination-controls" class="flex justify-center items-center gap-4 mt-8 pt-4 border-t border-gray-100" style="display: none;">
                        <button id="prev-btn" class="flex items-center px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-left mr-2"></i> Trước
                        </button>
                        <span class="text-sm font-medium text-gray-600 bg-gray-100 px-3 py-1 rounded-md">
                            Trang <span id="current-page" class="text-gray-900 font-bold">1</span> / <span id="total-pages">1</span>
                        </span>
                        <button id="next-btn" class="flex items-center px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                            Sau <i class="fas fa-chevron-right ml-2"></i>
                        </button>
                    </div>
                    
                    <div id="no-reminders" class="flex flex-col items-center justify-center py-12 text-center" style="display: none;">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center text-gray-300 mb-4">
                            <i class="fas fa-bell-slash text-2xl"></i>
                        </div>
                        <h3 class="text-gray-900 font-medium mb-1">Không có nhắc nhở nào</h3>
                        <p class="text-gray-500 text-sm">Bạn hiện không có lịch hẹn hay thông báo mới nào.</p>
                        <button class="mt-4 px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition shadow-sm">
                            Đặt lịch khám ngay
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    </div>


    <script src="/Js/main.js"></script>
    <script src="/Js/reminders.js"></script>
</body>
</html>
