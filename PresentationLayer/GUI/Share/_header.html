<!-- Header (Improved) -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            
            <!-- 1. Logo & Brand -->
            <div class="flex-shrink-0 flex items-center">

                    </div>

            </div>

            <!-- 2. Desktop Navigation (Centered) -->
            <nav class="hidden md:flex items-center space-x-1 bg-gray-50/50 p-1.5 rounded-full border border-gray-100">
                <a href="/GUI/home.html" class="px-4 py-2 text-sm font-medium text-gray-600 rounded-full hover:text-blue-600 hover:bg-white hover:shadow-sm transition-all duration-200 flex items-center">
                    <i class="fas fa-home mr-2"></i> Trang chủ
                </a>
                <!-- Active Link Example -->
                <a href="/GUI/Page/appointments.html" class="px-4 py-2 text-sm font-bold text-blue-600 bg-white rounded-full shadow-sm border border-gray-100 transition-all duration-200 flex items-center">

                </a>
                <a href="/GUI/Page/reminders.html" class="px-4 py-2 text-sm font-medium text-gray-600 rounded-full hover:text-blue-600 hover:bg-white hover:shadow-sm transition-all duration-200 flex items-center">

                </a>
            </nav>

            <!-- 3. Right Section: Weather & User Profile -->
            <div class="hidden md:flex items-center gap-5">
                
                <!-- Weather Widget (Compact) -->
                <div class="hidden lg:flex flex-col items-end border-r border-gray-200 pr-5">
                    <div class="flex items-center text-gray-700">
                        <span id="weather-icon" class="mr-2 text-amber-400 text-lg"><i class="fas fa-cloud-sun"></i></span>
                        <span id="weather-temp" class="font-bold text-sm">28°C</span>
                    </div>
                    <div class="flex gap-2 text-xs text-gray-400 font-medium">
                        <span id="current-time">14:30</span>
                        <span>•</span>
                        <span id="current-date">26/11</span>
                    </div>
                </div>

                <!-- User Profile Dropdown -->
                <div class="relative group">
                    <button class="flex items-center gap-3 focus:outline-none p-1 rounded-full hover:bg-gray-50 transition-colors">
                        <div class="text-right hidden xl:block">
                            <p id="welcome-user" class="text-sm font-bold text-gray-800 leading-tight">Nguyễn Văn A</p>
                            <p class="text-[10px] font-semibold text-blue-600 uppercase tracking-wide bg-blue-50 px-1.5 py-0.5 rounded inline-block mt-0.5">Bệnh nhân</p>
                        </div>
                        <div class="relative">
                            <div class="w-10 h-10 rounded-full bg-gray-200 border-2 border-white shadow-sm overflow-hidden ring-1 ring-gray-100">
                                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User Avatar" class="w-full h-full object-cover">
                            </div>
                            <!-- Online Status Dot -->
                            <span class="absolute bottom-0 right-0 block h-2.5 w-2.5 rounded-full bg-green-400 ring-2 ring-white"></span>
                        </div>
                        <i class="fas fa-chevron-down text-gray-300 text-xs group-hover:text-blue-500 transition-colors ml-1"></i>
                    </button>

                    <!-- Dropdown Menu -->
                    <div class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top-right scale-95 group-hover:scale-100 z-50">
                        <div class="px-4 py-2 border-b border-gray-50 mb-1 xl:hidden">
                            <p class="text-sm font-bold text-gray-800">Nguyễn Văn A</p>
                            <p class="text-xs text-gray-500">nguyenvana@example.com</p>
                        </div>
                        
                        <a href="/GUI/Page/profile.html" class="flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            <div class="w-8 flex justify-center"><i class="fas fa-user-circle"></i></div>
                            Hồ sơ cá nhân
                        </a>
                        <a href="/GUI/Page/medical_history.html" class="flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            <div class="w-8 flex justify-center"><i class="fas fa-file-medical"></i></div>
                            Bệnh án điện tử
                        </a>
                        
                        <div class="border-t border-gray-100 my-1"></div>
                        
                        <button id="logout-button" class="w-full text-left flex items-center px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                            <div class="w-8 flex justify-center"><i class="fas fa-sign-out-alt"></i></div>
                            Đăng xuất
                        </button>
                    </div>
                </div>
            </div>

            <!-- 4. Mobile Menu Button -->
            <div class="md:hidden flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User" class="w-full h-full object-cover">
                </div>
                <button id="mobile-menu-btn" class="text-gray-500 hover:text-blue-600 focus:outline-none p-2 bg-gray-50 rounded-lg">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 5. Mobile Navigation Menu (Dropdown) -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 z-40">
        <div class="px-4 py-2 bg-blue-50 border-b border-blue-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-200 flex items-center justify-center text-blue-600 font-bold">A</div>
                <div>
                    <p class="text-sm font-bold text-gray-900">Nguyễn Văn A</p>
                    <p class="text-xs text-blue-600">Thành viên hạng Bạc</p>
                </div>
            </div>
        </div>
        <div class="px-2 py-3 space-y-1">
            <a href="/GUI/home.html" class="block px-3 py-2.5 rounded-lg text-base font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                <i class="fas fa-home w-6 text-center"></i> Trang chủ
            </a>
            <a href="/GUI/Page/appointments.html" class="block px-3 py-2.5 rounded-lg text-base font-bold text-blue-700 bg-blue-50 transition-colors">
                <i class="fas fa-calendar-check w-6 text-center"></i> Lịch hẹn
            </a>
            <a href="/GUI/Page/reminders.html" class="block px-3 py-2.5 rounded-lg text-base font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                <i class="fas fa-bell w-6 text-center"></i> Thông báo <span class="ml-2 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">2</span>
            </a>
            <a href="/GUI/Page/profile.html" class="block px-3 py-2.5 rounded-lg text-base font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                <i class="fas fa-user w-6 text-center"></i> Hồ sơ cá nhân
            </a>
            <div class="border-t border-gray-100 my-2"></div>
            <button class="w-full text-left px-3 py-2.5 rounded-lg text-base font-medium text-red-600 hover:bg-red-50 transition-colors">
                <i class="fas fa-sign-out-alt w-6 text-center"></i> Đăng xuất
            </button>
        </div>
    </div>
</header>

<script>
    // Script xử lý Mobile Menu
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        
        if(btn && menu) {
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
                const icon = btn.querySelector('i');
                if (menu.classList.contains('hidden')) {
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                    btn.classList.remove('bg-blue-50', 'text-blue-600');
                } else {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-times');
                    btn.classList.add('bg-blue-50', 'text-blue-600');
                }
            });
        }
    });
</script>
