<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - UMBRELLA CORP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Đảm bảo tất cả input fields dùng Inter font */
        input, select, textarea, label {
            font-family: 'Inter', sans-serif !important;
        }
        .admin-menu a {
            display: block;
            padding: 0.75rem 1.5rem;
            color: #374151;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .admin-menu a:hover {
            background-color: #f3f4f6;
            border-left-color: #3b82f6;
            color: #1f2937;
        }
        .admin-menu h3 {
            padding: 1rem 1.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #111827;
        }
        .admin-menu .separator {
            border-top: 1px solid #e5e7eb;
            margin: 1rem 0;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="header-placeholder"></div>

    <div class="flex">
        <!-- Left Sidebar -->
        <aside class="w-64 bg-white shadow-md min-h-screen admin-menu">
            <nav>
                <h3>Dashboard</h3>
                <a href="#dashboard">Dashboard</a>
                <div class="separator"></div>

                <h3>Lịch khám bệnh</h3>
                <a href="#thu_tu_kham">Thứ tự khám</a>
                <a href="#quan_ly_lich_lam_viec">Lịch Nghỉ phép</a>               
                <a href="#lich_hen">Lịch hẹn</a>
                <div class="separator"></div>

                <h3>Quản trị viên</h3>
                <a href="#chuyen_khoa">Chuyên khoa</a>
                <a href="#bac_si">Bác sĩ</a>
                <a href="#benh_nhan">Bệnh nhân</a>
                <a href="#dich_vu">Dịch vụ</a>
                <div class="separator"></div>

                <h3>Khám chữa bệnh</h3>
                <a href="#phac_do">Phác đồ điều trị</a>
                <a href="#benh_an">Bệnh án</a>
                <div class="separator"></div>

                <h3>Cá nhân</h3>
                <a href="#">Thông tin cá nhân</a>
                <a href="#">Bảo mật</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 p-8">
            <!-- Content will be loaded here -->
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/Js/main.js"></script>
    <script>
        const mainContent = document.getElementById('main-content');
        const adminMenu = document.querySelector('.admin-menu');

        const loadContent = (pageUrl) => {
            fetch(pageUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    mainContent.innerHTML = html;
                    // Find and re-execute scripts within the loaded content
                    const scripts = mainContent.querySelectorAll('script');
                    scripts.forEach(script => {
                        if (script.src) {
                            // Handle external scripts with cache-busting
                            const newScript = document.createElement('script');
                            Array.from(script.attributes).forEach(attr => {
                                newScript.setAttribute(attr.name, attr.value);
                            });
                            newScript.src = script.src.split('?')[0] + '?t=' + new Date().getTime();
                            script.parentNode.removeChild(script);
                            document.body.appendChild(newScript);
                        } else {
                            // Handle inline scripts by evaluating their content
                            try {
                                eval(script.innerText);
                            } catch (e) {
                                console.error("Error executing inline script: ", e);
                                console.error("Script content:", script.innerText);
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading page:', error);
                    mainContent.innerHTML = `<p class="text-center text-red-500">Failed to load content. Please check the console.</p>`;
                });
        };

        // Use event delegation for navigation
        adminMenu.addEventListener('click', (event) => {
            const link = event.target.closest('a');
            if (link && link.getAttribute('href')?.startsWith('#')) {
                event.preventDefault();
                const page = link.getAttribute('href').substring(1);
                if (page) {
                    // Construct the correct path
                    const pagePath = `/GUI/Admin_page/${page}.html`;
                    // Update URL hash for better history management
                    window.location.hash = page;
                    loadContent(pagePath);
                }
            }
        });

        // Function to load content based on URL hash
        const loadContentFromHash = () => {
            const page = window.location.hash.substring(1) || 'dashboard'; // Default to dashboard
            const pagePath = `/GUI/Admin_page/${page}.html`;
            loadContent(pagePath);
        };

        // Load initial content based on the URL hash, or default to dashboard
        loadContentFromHash();

        // Listen for hash changes (e.g., browser back/forward buttons)
        window.addEventListener('hashchange', loadContentFromHash);

        document.addEventListener('DOMContentLoaded', function() {

        });
    </script>
</body>
</html>
