<!-- Chatbot Widget -->
<style>
    #chatbot-messages::-webkit-scrollbar { display: none; }
    #chatbot-messages { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Loading animation for chatbot */
    .chatbot-loading {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #999;
        animation: chatbot-bounce 1.4s infinite ease-in-out both;
    }
    .chatbot-loading:nth-child(1) { animation-delay: -0.32s; }
    .chatbot-loading:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes chatbot-bounce {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1); }
    }
</style>

<div id="chatbot-widget" class="fixed bottom-6 right-6 z-50">
    <!-- Chatbot Icon Button -->
    <button id="chatbot-toggle" class="w-16 h-16 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg flex items-center justify-center transition-all duration-300 hover:scale-110 group">
        <i class="fas fa-comments text-2xl group-hover:hidden"></i>
        <i class="fas fa-times text-2xl hidden group-hover:block"></i>
    </button>

    <!-- Chatbot Chat Window -->
    <div id="chatbot-window" class="hidden absolute bottom-24 right-0 w-96 max-w-md bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col max-h-96 md:max-h-[500px]">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 rounded-t-2xl">
            <h3 class="font-bold text-lg">Hỗ trợ khách hàng</h3>
            <p class="text-sm text-blue-100">Chúng tôi luôn sẵn sàng giúp bạn</p>
        </div>

        <!-- Chat Messages Container -->
        <div id="chatbot-messages" class="flex-grow overflow-y-auto p-4 space-y-4 bg-gray-50">
            <!-- Initial greeting message -->
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-sm"></i>
                </div>
                <div class="bg-white rounded-lg rounded-tl-none p-3 shadow-sm max-w-xs">
                    <p class="text-gray-800 text-sm">Xin chào! 👋 Tôi có thể giúp gì cho bạn hôm nay?</p>
                </div>
            </div>
        </div>

        <!-- Input Form -->
        <div class="border-t border-gray-200 p-4 bg-white rounded-b-2xl">
            <form id="chatbot-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="chatbot-input" 
                    placeholder="Nhập câu hỏi của bạn..." 
                    class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 text-sm"
                />
                <button 
                    type="submit" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition font-semibold"
                >
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>
