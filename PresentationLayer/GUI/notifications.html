<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo - Hệ Thống Quản Lý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="notifications-page">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Thông báo</h1>
            <div class="bg-white rounded-lg shadow-md">
                <ul class="divide-y divide-gray-200">
                    <!-- Ví dụ 1: Thông báo chưa đọc -->
                    <li class="p-4 hover:bg-gray-50 flex items-start space-x-4">
                        <div class="w-2 h-2 bg-blue-500 rounded-full mt-2"></div>
                        <div>
                            <p class="font-semibold">Nhắc lịch khám ngày mai</p>
                            <p class="text-sm text-gray-600">Bạn có lịch khám Tim mạch với BS. Nguyễn Văn A vào lúc 09:00 ngày 25/12/2024. Vui lòng đến sớm 15 phút.</p>
                            <p class="text-xs text-gray-400 mt-1">1 giờ trước</p>
                        </div>
                    </li>
                    <!-- Ví dụ 2: Thông báo đã đọc -->
                    <li class="p-4 hover:bg-gray-50 flex items-start space-x-4">
                        <div class="w-2 h-2 bg-transparent rounded-full mt-2"></div>
                        <div>
                            <p class="text-gray-700">Lịch hẹn đã được xác nhận</p>
                            <p class="text-sm text-gray-600">Lịch khám Tim mạch của bạn đã được xác nhận thành công.</p>
                            <p class="text-xs text-gray-400 mt-1">2 ngày trước</p>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    </div>

    <script src="../Js/main.js"></script>

</body>
</html>
